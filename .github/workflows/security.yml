name: Security analysis

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-review:
    name: Abhängigkeitsprüfung (SCA)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Neue Abhängigkeiten auf bekannte Schwachstellen prüfen
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7.0.1
      - name: CodeQL initialisieren
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
      - name: CodeQL-Analyse ausführen
        uses: github/codeql-action/analyze@v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
