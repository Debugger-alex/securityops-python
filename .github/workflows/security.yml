name: Security analysis

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Abhängigkeitsprüfung (SCA)
    runs-on: ubuntu-24.04
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7.0.1
      - name: Python einrichten
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Node.js einrichten
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: Python-Abhängigkeiten auf bekannte Schwachstellen prüfen
        run: |
          python -m pip install pip-audit
          pip-audit backend --skip-editable
      - name: NPM-Abhängigkeiten ab mittlerer Schwere prüfen
        run: npm audit --prefix frontend --audit-level=moderate

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v7.0.1
      - name: CodeQL initialisieren
        uses: github/codeql-action/init@v4.39.3
        with:
          languages: ${{ matrix.language }}
      - name: CodeQL-Analyse ausführen
        uses: github/codeql-action/analyze@v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
